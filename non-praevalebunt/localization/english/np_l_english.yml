l_english:
 # Start of game: a letter from the Pope (events/np_events.txt)
 np_events.0001.opening.son: "Beloved son in Christ,"
 np_events.0001.opening.daughter: "Beloved daughter in Christ,"
 np_events.0001.desc: "Our Lord said to Peter: “Thou art Peter; and upon this rock I will build my church, and the gates of hell shall not prevail against it.” (Matthew 16:18)\n\nBy that promise, the Church will never teach error in faith or morals. Her rites pray in many tongues and keep many customs, yet she holds one faith. Should any rite stray from it, Rome will call it home, and you will see it in your rite updates.\n\nKeep the faith, and keep your house in it."
 np_events.0001.a: "Amen."

 # A bull set aside (events/np_events.txt)
 np_events.0002.opening: "To the faithful of every land,"
 np_events.0002.desc.permit: "A bull was drawn up in my name, declaring [tenet_scope.GetName( bull_issuer.GetRite )] a teaching in good standing. I have set it aside. It will not bear my seal.\n\nThe successor of Peter guards what Christ handed down; he cannot change it. As the Apostle wrote: “Though we, or an angel from heaven, preach a gospel to you besides that which we have preached to you, let him be anathema.” (Galatians 1:8)"
 np_events.0002.desc.prohibit: "A bull was drawn up in my name, condemning [tenet_scope.GetName( bull_issuer.GetRite )]. I have set it aside. It will not bear my seal, for what the Church has always believed she cannot now condemn.\n\nThe successor of Peter guards what Christ handed down; he cannot change it. As the Apostle wrote: “Hold the traditions which you have learned, whether by word, or by our epistle.” (2 Thessalonians 2:14)"
 np_events.0002.a: "Amen."

 # v0.2: a council ruling not confirmed (events/np_events.txt, common/scripted_effects/zzz_np_lock_effects.txt)
 np_council_ruling_set_aside_tt: "The Pope will not confirm this ruling: it goes against the faith of the Church"
 np_events.0003.desc.permit: "The council voted to receive [np_council_tenet.GetName( np_pope.GetRite )] as a teaching in good standing. I have not confirmed it, and it does not bind the Church.\n\n$np_events.0003.catechesis$"
 np_events.0003.desc.prohibit: "The council voted to condemn [np_council_tenet.GetName( np_pope.GetRite )]. I have not confirmed it, for what the Church has always believed, no council may condemn.\n\n$np_events.0003.catechesis$"
 np_events.0003.desc.doctrine: "The council voted to adopt [np_council_doctrine.GetDescriptiveName( np_pope.GetFaith.Self )]. I have not confirmed it, and the Church keeps her discipline as before.\n\n$np_events.0003.catechesis$"
 np_events.0003.catechesis: "A council speaks for the whole Church only in union with the successor of Peter. So it has always been: my predecessor Saint Leo the Great would not confirm a canon of the Council of Chalcedon, and Rome never received it."
 np_events.0003.a: "Amen."

 # v0.3: Seek Communion is a true return (common/scripted_effects/zzz_np_heresy_effects.txt, events/np_events.txt)
 np_seek_communion_true_return_tt: "The rites of [actor.GetFaith.GetName] return to the Church, laying down every belief she forbids (Non Praevalebunt)"
 np_events.0004.desc: "Those who followed [np_returning_faith.GetName] have renounced their errors and come home to the unity of the Church. Their rites are received as rites of the Church, and their leaders are absolved.\n\nOur Lord said: “There shall be joy in heaven upon one sinner that doth penance, more than upon ninety-nine just who need not penance.” (Luke 15:7) The door stands open to all who return; they come in by the truth, laying their errors down at the threshold."
 np_events.0004.a: "Thanks be to God."

 # v0.2: the rite window lock (common/religion/doctrine_types/np_doctrine_overrides.txt)
 NP_RITE_WINDOW_LOCK: "Nothing in this [rite|E] may go against the faith or morals of the Church (Non Praevalebunt)"

 # v0.2: rites in good standing can't be branded a heresy (common/scripted_triggers/zzz_np_lock_triggers.txt)
 np_rite_heresy_not_good_standing_tt: "The [rite|E] holds beliefs the Church forbids"

 # The Pope's bulls on tenets (common/scripted_triggers/zzz_np_tenet_stance_triggers.txt)
 np_tenet_cannot_be_permitted_tt: "The Church cannot approve a teaching against the faith or morals she received from Christ"
 np_tenet_cannot_be_prohibited_tt: "The Church cannot condemn her own teaching, which she received from Christ"

 # Game rule: Pope as head of faith before the Great Schism
 rule_np_pope_head_before_schism: "Pope as Head Before the Schism"
 setting_np_pope_head_before_schism_on: "On"
 setting_np_pope_head_before_schism_on_desc: "Before the Great Schism, the Pope is [head_of_faith|E] of the undivided Church, so its main [rite|E] follows him and stays Roman. Rome keeps this primacy even if the schism is prevented. (Non Praevalebunt)"
 setting_np_pope_head_before_schism_off: "Off"
 setting_np_pope_head_before_schism_off_desc: "As in the base game: the undivided Church has no [head_of_faith|E] until the Great Schism. Its main [rite|E] goes to a rite with more counties and at least as many holy sites."

 # Be Fruitful and Multiply: what changes within the Church
 doctrine_parameter_np_blessed_children_piety: "Within the Catholic Church: parents gain [piety|E] for each child born of their marriage, and divorce for low [fertility|E] still needs the Church's approval"

 # Adaptability: pluralism requirement within the Church
 NP_ADAPTIVE_PLURALISM: "Requires the [doctrine|E] Pluralistic, or Righteous within the Catholic Church"
 NP_RIGHTEOUS_ADAPTIVE: "Incompatible with the [core_tenet|E] Adaptability, except within the Catholic Church"

 # Rome keeps the primacy before the schism (game rule on)
 np_msg_rome_keeps_primacy: "The Keys of Peter"
 np_msg_rome_keeps_primacy_desc: "Some would set another see over the whole Church. Yet Christ gave the keys of the kingdom to Peter (Matthew 16:19), and they pass to his successor, the Bishop of Rome. The Pope remains [head_of_faith|E] of the undivided Church."
